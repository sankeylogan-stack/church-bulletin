<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Bulletin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;family=Work+Sans:wght@400;500;600&amp;family=Playfair+Display:ital,wght@1,800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe7d8;
    --paper-card: #faf6ec;
    --ink: #2b2420;
    --ink-soft: #5a4f42;
    --rule: #c9bca0;
    --burgundy: #7a2e2e;
    --burgundy-dim: #9a5050;
    --brass: #a87c3f;
    --focus: #3d6b6b;
  }
  :root:not([data-theme="light"]) {
    /* keep light identity even under system dark mode — a bulletin reads as paper, not a screen */
  }
  * { box-sizing: border-box; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  html, body {
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .sans { font-family: "Work Sans", system-ui, sans-serif; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  .sheet {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    --sheet-pad: 36px;
    padding: 40px var(--sheet-pad) 44px;
  }
  @media (max-width: 480px) {
    .sheet { --sheet-pad: 20px; padding: 32px var(--sheet-pad) 36px; }
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .church-name {
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 1.15;
  }
  .tagline {
    margin: 4px 0 0;
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .week-of {
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    color: var(--burgundy);
    white-space: nowrap;
    font-weight: 600;
  }
  .date-note {
    font-family: "Work Sans", sans-serif;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin: 3px 0 0;
  }
  .occasion-badge {
    display: inline-block;
    font-family: "Work Sans", sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--paper-card);
    background: var(--brass);
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 22px 0;
  }
  .rule.thick {
    border-top: 2px solid var(--ink);
    margin: 28px 0;
  }

  .scripture-ref {
    text-align: center;
    font-family: "Work Sans", sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scripture-ref::before,
  .scripture-ref::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .scripture-text {
    white-space: pre-line;
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1.65;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .preacher-line {
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--burgundy);
    margin: 0;
  }
  .sermon-note {
    font-family: "Work Sans", sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 10px 0 0;
  }
  .sermon-note a {
    color: var(--burgundy);
    font-weight: 600;
  }
  .prayer-banner {
    position: relative;
    display: block;
    aspect-ratio: 18 / 5;
    margin: 20px calc(-1 * var(--sheet-pad)) 0;
    background: #141213;
    overflow: hidden;
    text-decoration: none;
    container-type: inline-size;
  }
  .prayer-banner .pb-photo {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: auto;
    max-width: none;
  }
  .prayer-banner .pb-fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #141213 0%, #141213 40%, rgba(20, 18, 19, 0) 64%);
  }
  .prayer-banner .pb-text {
    position: absolute;
    left: 6%;
    top: 50%;
    transform: translateY(-50%);
    max-width: 46%;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 800;
    font-size: 1.9rem;
    font-size: clamp(1.3rem, 8.4cqw, 2.9rem);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: #fff;
  }
  .prayer-banner:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .prayer-banner .pb-photo { transition: filter 0.3s ease; }
  }
  .prayer-banner:hover .pb-photo { filter: brightness(1.25); }

  .submit-prayer-note {
    font-family: "Work Sans", sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 10px 0 0;
  }
  .submit-prayer-note a {
    color: var(--burgundy);
    font-weight: 600;
    text-decoration: underline;
  }

  section.todays-text,
  section.prayer-special {
    background: linear-gradient(175deg, rgba(168, 124, 63, 0.10), rgba(168, 124, 63, 0.03));
    border-left: 3px solid var(--brass);
    padding: 18px 22px 20px;
    margin: 24px 0;
  }
  section.todays-text h2,
  section.prayer-special h2 { margin-bottom: 12px; }

  .sermon-thumb {
    position: relative;
    display: block;
    margin: 4px 0 18px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 1px 0 rgba(43, 36, 32, 0.06);
  }
  .sermon-thumb img {
    display: block;
    width: 100%;
    height: auto;
  }
  .play-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    background: rgba(250, 246, 236, 0.94);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
  }
  .play-badge::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    margin: -11px 0 0 -6px;
    border-style: solid;
    border-width: 11px 0 11px 18px;
    border-color: transparent transparent transparent var(--burgundy);
  }
  a.sermon-thumb:hover .play-badge { background: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .sermon-thumb img { transition: transform 0.35s ease; }
    a.sermon-thumb:hover img { transform: scale(1.025); }
    .play-badge { transition: background 0.2s ease; }
  }
  .sermon-caption {
    text-align: center;
    font-family: "Work Sans", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: -4px 0 14px;
  }

  .sermon-blurb {
    line-height: 1.7;
    color: var(--ink);
    margin: 0 0 8px;
    max-width: 62ch;
  }

  .prayer-body {
    line-height: 1.7;
    color: var(--ink);
    margin: 0;
    max-width: 62ch;
  }

  section { margin: 30px 0; }
  section:first-of-type { margin-top: 0; }

  h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--burgundy);
  }

  .welcome p {
    margin: 0;
    line-height: 1.7;
    color: var(--ink);
    max-width: 62ch;
    white-space: pre-line;
  }

  ol.order {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: order-counter;
  }
  ol.order li {
    counter-increment: order-counter;
    display: flex;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    align-items: baseline;
  }
  ol.order li:last-child { border-bottom: none; }
  ol.order li::before {
    content: counter(order-counter);
    font-family: "Work Sans", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--brass);
    min-width: 1.2em;
  }
  ol.order li span { line-height: 1.5; }

  ul.plain {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.plain li {
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    line-height: 1.6;
  }
  ul.plain li:last-child { border-bottom: none; }
  ul.plain.prayer li::before {
    content: "•";
    color: var(--burgundy-dim);
    margin-right: 10px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .links a {
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--paper-card);
    background: var(--burgundy);
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 2px;
  }
  .links a:hover { background: var(--burgundy-dim); }
  .links a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .contact {
    font-family: "Work Sans", sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.8;
  }

  .foot {
    text-align: center;
    margin-top: 20px;
  }
  .foot button {
    font-family: "Work Sans", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }
  .updated-note {
    text-align: center;
    font-family: "Work Sans", sans-serif;
    font-size: 0.72rem;
    color: var(--ink-soft);
    opacity: 0.7;
    margin-top: 6px;
  }

  /* Edit mode */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: "Work Sans", sans-serif;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    font-family: "Source Serif 4", serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 9px 10px;
    resize: vertical;
  }
  .field textarea { min-height: 84px; line-height: 1.5; }
  .list-editor .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .list-editor .row input { flex: 1; }
  .list-editor .row button, .list-editor .add-row button {
    font-family: "Work Sans", sans-serif;
    font-size: 0.78rem;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0 10px;
  }
  .add-row { margin-top: 4px; }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) { .two-col { grid-template-columns: 1fr; } }

  .primary-btn {
    font-family: "Work Sans", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--paper-card);
    background: var(--burgundy);
    border: none;
    border-radius: 2px;
    padding: 12px 20px;
    cursor: pointer;
    width: 100%;
  }
  .primary-btn:hover { background: var(--burgundy-dim); }
  .primary-btn:disabled { opacity: 0.6; cursor: default; }

  .save-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 24px;
  }
  .cancel-link {
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    white-space: nowrap;
  }
  .status {
    text-align: center;
    font-family: "Work Sans", sans-serif;
    font-size: 0.78rem;
    color: var(--focus);
    margin-top: 10px;
    min-height: 1em;
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: settle 0.4s ease-out; }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

    html += '</div>';
    html += '<div style="text-align:right">';
    if (d.weekOf) {
      html += '<p class="week-of">' + esc(d.weekOf);
      if (d.occasion) html += '<span class="occasion-badge">' + esc(d.occasion) + '</span>';
      html += '</p>';
    }
    if (d.dateNote) html += '<p class="date-note">' + esc(d.dateNote) + '</p>';
    html += '</div>';
    html += '</div>';

    html += '<hr class="rule thick">';

    if (d.welcome) {
      html += '<section class="welcome"><h2>Welcome</h2><p>' + esc(d.welcome) + '</p></section>';
    }

    if (d.purpose) {
      html += '<section class="purpose"><h2>Our Purpose</h2><p>' + esc(d.purpose) + '</p></section>';
    }

    if (d.scriptureRef || d.scripture || d.preacher || d.sermonLink) {
      html += '<section class="todays-text"><h2>Today\u2019s Text</h2>';
      if (d.scriptureRef) html += '<p class="scripture-ref">' + esc(d.scriptureRef) + '</p>';
      if (d.scripture) html += '<p class="scripture-text">' + esc(d.scripture) + '</p>';
      if (d.preacher) html += '<p class="preacher-line">' + esc(d.preacher) + '</p>';
      if (d.sermonLink) html += '<p class="sermon-note">' + esc(d.sermonNoteLead || 'Missed last week?') + ' <a href="' + esc(d.sermonLink) + '">' + esc(d.sermonNoteLinkText || d.lastSermonTitle || 'Catch the sermon here') + '</a></p>';
      html += '</section>';
      html += '<hr class="rule">';
    }

    if (d.waysToServe && d.waysToServe.filter(Boolean).length) {
      html += '<section><h2>Ways to Serve This Week</h2><ul class="plain">';
      d.waysToServe.forEach(function (item) {
        if (item) html += '<li>' + esc(item) + '</li>';
      });
      html += '</ul></section>';
    }

    if (d.order && d.order.length) {
      html += '<section><h2>Order of Service</h2><ol class="order">';
      d.order.forEach(function (item) {
        if (item) html += '<li><span>' + esc(item) + '</span></li>';
      });
      html += '</ol></section>';
    }

    if (d.announcements && d.announcements.filter(Boolean).length) {
      html += '<section><h2>Announcements</h2><ul class="plain">';
      d.announcements.forEach(function (item) {
        if (item) html += '<li>' + esc(item) + '</li>';
      });
      html += '</ul></section>';
    }

    if (d.upcoming && d.upcoming.filter(Boolean).length) {
      html += '<section><h2>Upcoming Events</h2><ul class="plain">';
      d.upcoming.forEach(function (item) {
        if (item) html += '<li>' + esc(item) + '</li>';
      });
      html += '</ul></section>';
    }

    if (d.prayer && d.prayer.filter(Boolean).length) {
      html += '<section><h2>Prayer Requests</h2><ul class="plain prayer">';
      d.prayer.forEach(function (item) {
        if (item) html += '<li>' + esc(item) + '</li>';
      });
      html += '</ul>';
      if (d.prayerRequestLink && d.prayerBannerImage) {
        html += '<a class="prayer-banner" href="' + esc(d.prayerRequestLink) + '" aria-label="Submit a prayer request">' +
          '<img class="pb-photo" src="' + esc(d.prayerBannerImage) + '" alt="">' +
          '<span class="pb-fade" aria-hidden="true"></span>' +
          '<span class="pb-text">' + esc(d.prayerBannerText || 'Submit a request') + '</span>' +
          '</a>';
      } else if (d.prayerRequestLink) {
        html += '<p class="submit-prayer-note"><a href="' + esc(d.prayerRequestLink) + '">Submit a Prayer Request</a></p>';
      } else {
        html += '<p class="submit-prayer-note">Submit a Prayer Request \u2014 <em>coming soon</em></p>';
      }
      html += '</section>';
    }

    if (d.prayerSalvationRef || d.prayerSalvationVerse || d.prayerSalvationText) {
      html += '<section class="prayer-special"><h2>A Prayer For Salvation</h2>';
      if (d.prayerSalvationRef) html += '<p class="scripture-ref">' + esc(d.prayerSalvationRef) + '</p>';
      if (d.prayerSalvationVerse) html += '<p class="scripture-text">' + esc(d.prayerSalvationVerse) + '</p>';
      if (d.prayerSalvationText) html += '<p class="prayer-body">' + esc(d.prayerSalvationText) + '</p>';
      html += '</section>';
    }

    if (d.prayerHolinessRef || d.prayerHolinessVerse || d.prayerHolinessText) {
      html += '<section class="prayer-special"><h2>A Prayer of Holiness For This Week</h2>';
      if (d.prayerHolinessRef) html += '<p class="scripture-ref">' + esc(d.prayerHolinessRef) + '</p>';
      if (d.prayerHolinessVerse) html += '<p class="scripture-text">' + esc(d.prayerHolinessVerse) + '</p>';
      if (d.prayerHolinessText) html += '<p class="prayer-body">' + esc(d.prayerHolinessText) + '</p>';
      html += '</section>';
    }

    if (d.lastSermonTitle || d.sermonLink) {
      html += '<section class="prayer-special"><h2>' + esc(d.sermonHeading || 'Missed Last Week?') + '</h2>';
      if (d.sermonImage) {
        var thumbAlt = esc(d.sermonImageAlt || d.lastSermonTitle || 'Sermon');
        var thumbInner = '<img src="' + esc(d.sermonImage) + '" alt="' + thumbAlt + '">';
        if (d.sermonLink) {
          html += '<a class="sermon-thumb" href="' + esc(d.sermonLink) + '" aria-label="Watch the sermon on YouTube">' + thumbInner + '<span class="play-badge" aria-hidden="true"></span></a>';
        } else {
          html += '<div class="sermon-thumb">' + thumbInner + '</div>';
        }
      }
      if (d.lastSermonTitle) html += '<p class="scripture-ref">' + esc(d.lastSermonTitle) + '</p>';
      if (d.sermonCaption) html += '<p class="sermon-caption">' + esc(d.sermonCaption) + '</p>';
      if (d.sermonBlurb) html += '<p class="sermon-blurb">' + esc(d.sermonBlurb) + '</p>';
      if (d.sermonLink) html += '<p class="sermon-note"><a href="' + esc(d.sermonLink) + '">' + esc(d.sermonLinkText || 'Catch the sermon here') + '</a></p>';
      html += '</section>';
    }

    var links = [];
    if (d.givingLink) links.push('<a href="' + esc(d.givingLink) + '">Give</a>');
    if (d.livestreamLink) links.push('<a href="' + esc(d.livestreamLink) + '">Watch Live</a>');
    if (d.websiteLink) links.push('<a href="' + esc(d.websiteLink) + '">Website</a>');
    if (links.length) {
      html += '<section><div class="links">' + links.join('') + '</div></section>';
    }

    if (d.contactName || d.contactPhone || d.contactAddress) {
      html += '<hr class="rule">';
      html += '<div class="contact">';
      if (d.contactName) html += esc(d.contactName) + '<br>';
      if (d.contactPhone) html += esc(d.contactPhone) + '<br>';
      if (d.contactAddress) html += esc(d.contactAddress);
      html += '</div>';
    }

    html += '<div class="foot">';
    if (canEdit) html += '<button class="sans" id="edit-btn" type="button">Edit this week\u2019s bulletin</button>';
    html += '</div>';
    if (d.updatedNote) html += '<p class="updated-note">' + esc(d.updatedNote) + '</p>';

    return html;
  }

  function renderView() {
    sheet.innerHTML = buildViewHTML(getData());
    if (canEdit) {
      var btn = document.getElementById('edit-btn');
      if (btn) btn.addEventListener('click', renderEdit);
    }
  }

  function listEditorHTML(id, label, items) {
    var rows = (items && items.length ? items : ['']).map(function (v, i) {
      return '<div class="row">' +
        '<input type="text" data-list="' + id + '" data-idx="' + i + '" value="' + esc(v) + '">' +
        '<button type="button" class="sans" data-remove="' + id + '" data-idx="' + i + '">Remove</button>' +
      '</div>';
    }).join('');
    return '<div class="field"><label>' + label + '</label>' +
      '<div class="list-editor" id="list-' + id + '">' + rows + '</div>' +
      '<div class="add-row"><button type="button" class="sans" data-add="' + id + '">+ Add line</button></div></div>';
  }

  function collectList(id) {
    var inputs = document.querySelectorAll('[data-list="' + id + '"]');
    var out = [];
    inputs.forEach(function (inp) { out.push(inp.value); });
    return out;
  }

  function wireListEditor(id, getItems, setItems) {
    var container = document.getElementById('list-' + id);
    container.parentElement.querySelector('[data-add="' + id + '"]').addEventListener('click', function () {
      var items = collectList(id);
      items.push('');
      setItems(items);
      rerenderList(id, items);
    });
    container.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-remove="' + id + '"]');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var items = collectList(id);
      items.splice(idx, 1);
      setItems(items);
      rerenderList(id, items);
    });
  }

  function rerenderList(id, items) {
    var container = document.getElementById('list-' + id);
    var rows = (items.length ? items : ['']).map(function (v, i) {
      return '<div class="row">' +
        '<input type="text" data-list="' + id + '" data-idx="' + i + '" value="' + esc(v) + '">' +
        '<button type="button" class="sans" data-remove="' + id + '" data-idx="' + i + '">Remove</button>' +
      '</div>';
    }).join('');
    container.innerHTML = rows;
  }

  function renderEdit() {
    var d = getData();
    var html = '<form id="edit-form">';

    html += '<div class="two-col">';
    html += '<div class="field"><label>Church name</label><input type="text" name="churchName" value="' + esc(d.churchName) + '"></div>';
    html += '<div class="field"><label>Week of</label><input type="text" name="weekOf" value="' + esc(d.weekOf) + '" placeholder="Sunday, Month Day"></div>';
    html += '<div class="field"><label>Occasion badge (optional, e.g. Conference Sunday)</label><input type="text" name="occasion" value="' + esc(d.occasion) + '"></div>';
    html += '</div>';
    html += '<div class="field"><label>Tagline</label><input type="text" name="tagline" value="' + esc(d.tagline) + '"></div>';
    html += '<div class="field"><label>Note under the date</label><input type="text" name="dateNote" value="' + esc(d.dateNote) + '"></div>';

    html += '<hr class="rule">';
    html += '<div class="field"><label>Scripture reference (stands alone above the text)</label><input type="text" name="scriptureRef" value="' + esc(d.scriptureRef) + '" placeholder="e.g. John 3:16"></div>';
    html += '<div class="field"><label>Today\u2019s Text (Scripture)</label><textarea name="scripture">' + esc(d.scripture) + '</textarea></div>';
    html += '<div class="field"><label>Preaching line</label><input type="text" name="preacher" value="' + esc(d.preacher) + '"></div>';

    html += '<div class="field"><label>Welcome message</label><textarea name="welcome">' + esc(d.welcome) + '</textarea></div>';
    html += '<div class="field"><label>Our Purpose (mission statement)</label><textarea name="purpose">' + esc(d.purpose) + '</textarea></div>';

    html += listEditorHTML('waysToServe', 'Ways to Serve This Week', d.waysToServe);

    html += '<hr class="rule">';
    html += listEditorHTML('order', 'Order of service', d.order);
    html += listEditorHTML('announcements', 'Announcements', d.announcements);
    html += listEditorHTML('prayer', 'Prayer requests', d.prayer);
    html += '<div class="field"><label>Submit-a-prayer-request link (leave blank to show \u201ccoming soon\u201d)</label><input type="text" name="prayerRequestLink" value="' + esc(d.prayerRequestLink) + '" placeholder="https://"></div>';
    html += '<div class="field"><label>A Prayer For Salvation \u2014 reference</label><input type="text" name="prayerSalvationRef" value="' + esc(d.prayerSalvationRef) + '" placeholder="e.g. Psalm 51:10"></div>';
    html += '<div class="field"><label>A Prayer For Salvation \u2014 verse</label><textarea name="prayerSalvationVerse">' + esc(d.prayerSalvationVerse) + '</textarea></div>';
    html += '<div class="field"><label>A Prayer For Salvation \u2014 prayer text</label><textarea name="prayerSalvationText">' + esc(d.prayerSalvationText) + '</textarea></div>';
    html += '<div class="field"><label>A Prayer of Holiness \u2014 reference</label><input type="text" name="prayerHolinessRef" value="' + esc(d.prayerHolinessRef) + '" placeholder="e.g. 2 Corinthians 7:1"></div>';
    html += '<div class="field"><label>A Prayer of Holiness \u2014 verse</label><textarea name="prayerHolinessVerse">' + esc(d.prayerHolinessVerse) + '</textarea></div>';
    html += '<div class="field"><label>A Prayer of Holiness \u2014 prayer text</label><textarea name="prayerHolinessText">' + esc(d.prayerHolinessText) + '</textarea></div>';
    html += listEditorHTML('upcoming', 'Upcoming Events', d.upcoming);

    html += '<hr class="rule">';
    html += '<div class="field"><label>Giving link</label><input type="text" name="givingLink" value="' + esc(d.givingLink) + '" placeholder="https://"></div>';
    html += '<div class="field"><label>Livestream link</label><input type="text" name="livestreamLink" value="' + esc(d.livestreamLink) + '" placeholder="https://"></div>';
    html += '<div class="field"><label>Last week\u2019s sermon link (audio/video)</label><input type="text" name="sermonLink" value="' + esc(d.sermonLink) + '" placeholder="https://"></div>';
    html += '<div class="field"><label>Last week\u2019s sermon title</label><input type="text" name="lastSermonTitle" value="' + esc(d.lastSermonTitle) + '"></div>';
    html += '<div class="field"><label>Website link</label><input type="text" name="websiteLink" value="' + esc(d.websiteLink) + '" placeholder="https://"></div>';

    html += '<hr class="rule">';
    html += '<div class="field"><label>Contact name / pastor</label><input type="text" name="contactName" value="' + esc(d.contactName) + '"></div>';
    html += '<div class="two-col">';
    html += '<div class="field"><label>Phone</label><input type="text" name="contactPhone" value="' + esc(d.contactPhone) + '"></div>';
    html += '<div class="field"><label>Address</label><input type="text" name="contactAddress" value="' + esc(d.contactAddress) + '"></div>';
    html += '</div>';

    html += '<div class="save-row">';
    html += '<button type="submit" class="primary-btn sans" id="publish-btn">Publish this week\u2019s bulletin</button>';
    html += '<button type="button" class="cancel-link sans" id="cancel-btn">Cancel</button>';
    html += '</div>';
    html += '<p class="status" id="status"></p>';
    html += '</form>';

    sheet.innerHTML = html;

    wireListEditor('order', function () { return getData().order; }, function () {});
    wireListEditor('waysToServe', function () { return getData().waysToServe; }, function () {});
    wireListEditor('announcements', function () { return getData().announcements; }, function () {});
    wireListEditor('upcoming', function () { return getData().upcoming; }, function () {});
    wireListEditor('prayer', function () { return getData().prayer; }, function () {});

    document.getElementById('cancel-btn').addEventListener('click', renderView);
    document.getElementById('edit-form').addEventListener('submit', onPublish);
  }

  async function onPublish(e) {
    e.preventDefault();
    var form = e.target;
    var statusEl = document.getElementById('status');
    var btn = document.getElementById('publish-btn');
    var d = getData();

    var fd = new FormData(form);
    ['churchName','weekOf','occasion','tagline','dateNote','scriptureRef','scripture','preacher','welcome','purpose','givingLink','livestreamLink','sermonLink','lastSermonTitle','websiteLink','contactName','contactPhone','contactAddress','prayerSalvationRef','prayerSalvationVerse','prayerSalvationText','prayerHolinessRef','prayerHolinessVerse','prayerHolinessText','prayerRequestLink'].forEach(function (k) {
      d[k] = fd.get(k) || '';
    });
    d.order = collectList('order').filter(function (v) { return v.trim() !== ''; });
    d.waysToServe = collectList('waysToServe').filter(function (v) { return v.trim() !== ''; });
    d.announcements = collectList('announcements').filter(function (v) { return v.trim() !== ''; });
    d.upcoming = collectList('upcoming').filter(function (v) { return v.trim() !== ''; });
    d.prayer = collectList('prayer').filter(function (v) { return v.trim() !== ''; });
    d.updatedNote = 'Updated ' + new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

    setData(d);
    btn.disabled = true;
    statusEl.textContent = 'Publishing\u2026';

    try {
      var artifact = await claude.use('artifact');
      if (!artifact) {
        statusEl.textContent = 'Publishing isn\u2019t available in this view. Copy is saved locally in this tab only.';
        btn.disabled = false;
        renderView();
        return;
      }
      // Build a clean, read-only snapshot to publish (not the live edit form).
      var cleanDoc = document.cloneNode(true);
      cleanDoc.getElementById('sheet').innerHTML = buildViewHTML(d);
      var fullHtml = '<!DOCTYPE html>\n' + cleanDoc.documentElement.outerHTML;
      var result = await artifact.publish(fullHtml);
      if (result) {
        statusEl.textContent = 'Published \u2014 loading the latest version\u2026';
      } else {
        statusEl.textContent = 'Couldn\u2019t publish. Please try again.';
        btn.disabled = false;
      }
    } catch (err) {
      statusEl.textContent = 'Couldn\u2019t publish (' + (err && err.code ? err.code : 'error') + '). Please try again.';
      btn.disabled = false;
    }
  }

  async function init() {
    try {
      var user = await claude.use('user');
      canEdit = user ? await user.canEdit() : false;
    } catch (e) {
      canEdit = false;
    }
    renderView();
  }

  init();
})();
</script>
